name: Playwright Test Suite

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    # 18:00 IST daily (IST = UTC+5:30)
    - cron: "30 12 * * *"

  workflow_dispatch:

jobs:
  test:
    name: Run Accutai Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install project dependencies
        run: uv sync --locked

      - name: Install Playwright's Chromium build
        run: uv run playwright install --with-deps chromium

      - name: Ensure reports/ and dark-theme.css exist
        run: |
          mkdir -p reports
          touch reports/dark-theme.css

      - name: Verify test files
        run: |
          echo "=== Test files ==="
          find tests -type f -print

      - name: Run test suite (headless)
        run: uv run pytest tests/test.py -v

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: reports/
          retention-days: 14

      - name: Clear test transactions (nightly run only)
        if: always() && github.event_name == 'schedule'
        run: uv run python scripts/delete_all_transactions.py
        # To use different demo credentials for cleanup,
        # add ACCUTAI_USERNAME and ACCUTAI_PASSWORD
        # as repository secrets.
        #
        # env:
        #   ACCUTAI_USERNAME: ${{ secrets.ACCUTAI_USERNAME }}
        #   ACCUTAI_PASSWORD: ${{ secrets.ACCUTAI_PASSWORD }}
