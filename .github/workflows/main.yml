name: Playwright Test Suite

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    # Every day at 18:00 IST (12:30 UTC)
    - cron: "30 12 * * *"

  workflow_dispatch:

jobs:
  test:
    name: Run Accutai Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      # 3. Install Python
      - name: Install Python
        run: uv python install

      # 4. Install project dependencies
      - name: Install project dependencies
        run: uv sync --locked

      # 5. Install Chromium
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # 6. Prepare reports directory
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          touch reports/dark-theme.css

      # 7. Run tests
      - name: Run test suite
        env:
          ACCUTAI_USERNAME: ${{ secrets.ACCUTAI_USERNAME }}
          ACCUTAI_PASSWORD: ${{ secrets.ACCUTAI_PASSWORD }}
        run: |
          echo "Running Accutai Playwright tests..."
          uv run pytest tests/test.py -v

      # 8. Upload reports even if tests fail
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: reports/
          retention-days: 14

      # 9. Delete test transactions after scheduled/nightly run
      - name: Clear test transactions
        if: always() && github.event_name == 'schedule'
        env:
          ACCUTAI_USERNAME: ${{ secrets.ACCUTAI_USERNAME }}
          ACCUTAI_PASSWORD: ${{ secrets.ACCUTAI_PASSWORD }}
        run: |
          uv run python scripts/delete_all_transactions.py
